type Client {
    id: ID!
    name: String
    age: Int
    documents: [Document!]
    relatives: [Relative!]
}

type Document {
    id: ID!
    type: String
    number: String
    issueDate: String
    expiryDate: String
}

type Relative {
    id: ID!
    relationType: String
    name: String
    age: Int
}

type Query {
    # Получаем все данные по клиенту
    client(id: ID!): Client

    # Список документов клиента
    clientDocuments(id: ID!): [Document!]

    # Информация о родственниках клиента
    clientRelatives(id: ID!): [Relative!]
}
