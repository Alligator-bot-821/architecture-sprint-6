apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
 name: scalable-pod-identifier-hpa
spec:
 scaleTargetRef:
   apiVersion: apps/v1
   kind: Deployment
   name: backend-deployment
 minReplicas: 2
 maxReplicas: 8
 metrics:
  - type: Resource
    resource:
      # memory cpu
      name: memory
      target:
        type: Utilization
        averageUtilization: 80