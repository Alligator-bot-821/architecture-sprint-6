apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
#  replicas: 4
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
        - name: backend-container
          image: scaletestapp:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
              requests:
#                  cpu: "8m"
                  memory: "20Mi"
              limits:
#                  cpu: "8m"
                  memory: "50Mi"
  selector:
    matchLabels:
      app: backend-app
